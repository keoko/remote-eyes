<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Help - Remote Screen</title>

    <style>
        :root {
            --gray: #6b7280;
            --blue: #2563eb;
            --green: #16a34a;
            --red: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            max-width: 640px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 20px;
        }

        .join-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input#code {
            font-size: 24px;
            letter-spacing: 4px;
            width: 160px;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-align: center;
        }

        button#join {
            font-size: 16px;
            font-weight: 600;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: var(--blue);
            color: white;
            cursor: pointer;
        }

        button#join:hover {
            opacity: 0.9;
        }

        #status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            padding: 8px 14px;
            border-radius: 999px;
            background: #f1f5f9;
            color: var(--gray);
            margin-bottom: 16px;
        }

        #status::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
        }

        #status[data-state="connecting"] {
            color: var(--blue);
            background: #eff6ff;
        }

        #status[data-state="connected"] {
            color: var(--green);
            background: #f0fdf4;
        }

        #status[data-state="error"] {
            color: var(--red);
            background: #fef2f2;
        }

        .video-wrap {
            position: relative;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
        }

        #videoPlaceholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="card">
    <h1>Help session</h1>

    <div class="join-row">
        <input id="code" placeholder="482731" maxlength="6" inputmode="numeric" autofocus>
        <button id="join">Join</button>
    </div>

    <div id="status" data-state="idle">Enter the help code.</div>

    <div class="video-wrap">
        <video id="screen" autoplay playsinline></video>
        <div id="videoPlaceholder">Waiting for the phone's screen…</div>
    </div>
</div>

<script>
const codeInput = document.getElementById("code");
const joinButton = document.getElementById("join");
const status = document.getElementById("status");
const video = document.getElementById("screen");
const videoPlaceholder = document.getElementById("videoPlaceholder");

let socket;
let peerConnection;

function setState(state, message) {
    console.log(message);
    status.dataset.state = state;
    status.textContent = message;
}

function send(message) {
    socket.send(JSON.stringify(message));
}

codeInput.focus();

codeInput.addEventListener("input", () => {
    codeInput.value = codeInput.value.replace(/\D/g, "").slice(0, 6);
});

codeInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        joinButton.click();
    }
});

/*
 * IMPORTANT:
 *
 * The Android app's SignalingClient speaks this exact shape:
 *
 *   { "type": "signal", "signalType": "offer" | "answer", "sdp": "..." }
 *   { "type": "signal", "signalType": "ice-candidate",
 *     "sdpMid": "...", "sdpMLineIndex": 0, "candidate": "..." }
 *
 * This page must send/receive the same field names or the two
 * sides will silently never understand each other.
 */

function sendAnswer(sdp) {
    send({
        type: "signal",
        signalType: "answer",
        sdp: sdp
    });
}

function sendIceCandidate(candidate) {
    send({
        type: "signal",
        signalType: "ice-candidate",
        sdpMid: candidate.sdpMid,
        sdpMLineIndex: candidate.sdpMLineIndex,
        candidate: candidate.candidate
    });
}

let iceServersPromise;

async function createPeerConnection() {
    const iceServers = await iceServersPromise;

    peerConnection = new RTCPeerConnection({ iceServers });

    peerConnection.onicecandidate = event => {
        if (event.candidate) {
            sendIceCandidate(event.candidate);
        }
    };

    peerConnection.ontrack = event => {
        console.log("Received remote track");

        if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
            videoPlaceholder.style.display = "none";
        }
    };

    peerConnection.onconnectionstatechange = () => {
        const connectionState = peerConnection.connectionState;
        const badgeState =
            connectionState === "connected" ? "connected"
                : (connectionState === "failed" || connectionState === "disconnected" || connectionState === "closed") ? "error"
                : "connecting";

        setState(badgeState, "WebRTC: " + connectionState);
    };

    peerConnection.oniceconnectionstatechange = () => {
        console.log("ICE connection state:", peerConnection.iceConnectionState);
    };
}

async function handleOffer(sdp) {
    await peerConnection.setRemoteDescription({
        type: "offer",
        sdp: sdp
    });

    const answer = await peerConnection.createAnswer();
    await peerConnection.setLocalDescription(answer);

    sendAnswer(answer.sdp);

    setState("connecting", "Answer sent. Connecting…");
}

async function handleIceCandidate(json) {
    try {
        await peerConnection.addIceCandidate({
            sdpMid: json.sdpMid,
            sdpMLineIndex: json.sdpMLineIndex,
            candidate: json.candidate
        });
    } catch (error) {
        console.error("ICE candidate error:", error);
    }
}

joinButton.onclick = () => {
    const code = codeInput.value.replace(/\s/g, "");

    if (code.length !== 6) {
        setState("idle", "Enter the six-digit code.");
        return;
    }

    setState("connecting", "Connecting…");

    iceServersPromise = fetch("/ice-config?code=" + code)
        .then(r => r.json())
        .then(config => config.iceServers)
        .catch(() => [{ urls: "stun:stun.l.google.com:19302" }]);

    const wsProtocol = window.location.protocol === "https:" ? "wss://" : "ws://";

    socket = new WebSocket(
        wsProtocol + window.location.host
    );

    socket.onopen = () => {
        setState("connecting", "Joining help session…");

        send({
            type: "join",
            code: code
        });
    };

    socket.onmessage = async event => {
        const message = JSON.parse(event.data);

        console.log("Signal:", message);

        if (message.type === "joined") {
            setState("connecting", "Joined. Waiting for screen…");
            await createPeerConnection();
            return;
        }

        if (message.type === "signal") {
            if (message.signalType === "offer") {
                await handleOffer(message.sdp);
            }

            else if (message.signalType === "ice-candidate") {
                await handleIceCandidate(message);
            }

            else {
                console.log("Unhandled signalType:", message.signalType);
            }
        }

        if (message.type === "peer-disconnected") {
            setState("error", "Phone disconnected.");
        }

        if (message.type === "expired") {
            setState("error", "Help session expired.");
        }

        if (message.type === "error") {
            setState("error", "Error: " + message.message);
        }
    };

    socket.onerror = error => {
        console.error(error);
        setState("error", "WebSocket error.");
    };

    socket.onclose = () => {
        console.log("WebSocket closed");
    };
};
</script>

</body>
</html>
